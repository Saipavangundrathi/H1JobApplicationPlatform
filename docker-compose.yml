version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: h1b-postgres
    environment:
      POSTGRES_DB: h1b_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - h1b-network

  redis:
    image: redis:7-alpine
    container_name: h1b-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - h1b-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: h1b-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@h1b.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - h1b-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  h1b-network:
    driver: bridge