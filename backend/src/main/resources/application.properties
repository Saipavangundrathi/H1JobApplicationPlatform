spring.application.name=H1B backend
# Include local secrets (git-ignored)
spring.profiles.include=local

# Docker Compose is managed externally (parent docker-compose.yml)
spring.docker.compose.enabled=false

# Database Configuration (Must match docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/h1b_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (Auto-creates tables for you)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RapidAPI credentials for JSearch
rapidapi.host=jsearch.p.rapidapi.com

# Resume upload limits (max 5MB) - multipart settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OpenAI Embedding Model (for RAG vector generation)
spring.ai.openai.embedding.model=text-embedding-3-small

# PgVector Store Configuration (RAG)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536